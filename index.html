<title>まこ の買い物リスト 🛒</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#FAF1E6;
    --surface:#FFFDF9;
    --surface-2:#FFF7EC;
    --ink:#2B2420;
    --ink-muted:#8A7F73;
    --accent:#E0623A;
    --accent-ink:#FFFBF6;
    --accent-soft:#F3C9B7;
    --accent-soft-ink:#8A4224;
    --divider:#E8DCCB;
    --danger:#B0392E;
    --danger-ink:#FFF3EF;
    --success:#5B8A66;
    --success-ink:#FFFBF6;
    --mark-pink:#F0AFC2;
    --mark-yellow:#FFD93D;
    --mark-blue:#9ED4E8;
    --shadow: 0 1px 2px rgba(43,36,32,0.06), 0 6px 20px rgba(43,36,32,0.06);
    --radius-lg: 20px;
    --radius-md: 12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1815;
      --surface:#241E19;
      --surface-2:#2A2320;
      --ink:#F3E9DD;
      --ink-muted:#9C8E7E;
      --accent:#F2825C;
      --accent-ink:#241005;
      --accent-soft:#6E4838;
      --accent-soft-ink:#FBE3D6;
      --divider:#3A322A;
      --danger:#E2685A;
      --danger-ink:#2A0F0A;
      --success:#7FBF95;
      --success-ink:#0E2016;
      --mark-pink:#D97C97;
      --mark-yellow:#F2C531;
      --mark-blue:#6FB6CE;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1815;
    --surface:#241E19;
    --surface-2:#2A2320;
    --ink:#F3E9DD;
    --ink-muted:#9C8E7E;
    --accent:#F2825C;
    --accent-ink:#241005;
    --accent-soft:#6E4838;
    --accent-soft-ink:#FBE3D6;
    --divider:#3A322A;
    --danger:#E2685A;
    --danger-ink:#2A0F0A;
    --success:#7FBF95;
    --success-ink:#0E2016;
    --mark-pink:#D97C97;
    --mark-yellow:#F2C531;
    --mark-blue:#6FB6CE;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; touch-action:manipulation; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"SF Pro JP",BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    overscroll-behavior-y:none;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 12px);
    gap:14px;
    overflow:hidden;
  }

  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:0 4px;
  }
  .topbar h1{
    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .topbar-right{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .count{
    font-size:13px;
    font-weight:600;
    color:var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .sync-status{
    font-size:12px;
    color:var(--ink-muted);
  }
  .sync-status.is-offline{ color:var(--danger); }

  .addbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:var(--radius-lg);
    padding:8px 8px 8px 12px;
    box-shadow:var(--shadow);
  }
  .mark-input{
    width:34px;
    height:34px;
    flex:0 0 34px;
  }
  .name-input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-size:20px;
    line-height:1.1;
    color:var(--ink);
    outline:none;
    padding:8px 4px;
  }
  .name-input::placeholder{ color:var(--ink-muted); }
  .add-btn{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:var(--accent-soft);
    color:var(--accent-soft-ink);
    font-size:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .add-btn:active{ transform:scale(0.9); }

  .list{
    list-style:none;
    margin:0;
    padding:0;
    background:var(--surface);
    border-radius:var(--radius-lg);
    border:1px solid var(--divider);
    box-shadow:var(--shadow);
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior-y:contain;
  }
  .empty{
    padding:34px 16px;
    text-align:center;
    color:var(--ink-muted);
    font-size:14px;
  }

  .row-wrapper{
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--divider);
  }
  .row-wrapper:last-child{ border-bottom:none; }

  .row-delete-bg{
    position:absolute;
    top:0; bottom:0; left:50%; right:0;
    display:flex;
    align-items:stretch;
    justify-content:flex-end;
    background:var(--danger);
  }
  .delete-btn{
    width:84px;
    border:none;
    background:transparent;
    color:var(--danger-ink);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
  }

  .row-complete-bg{
    position:absolute;
    top:0; bottom:0; left:0; right:50%;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    background:var(--success);
  }
  .complete-label{
    width:84px;
    text-align:center;
    color:var(--success-ink);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.02em;
  }

  .row{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    padding:9.5px 14px;
    transform:translateX(0);
    will-change:transform;
    touch-action:none;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .row.no-transition{ transition:none !important; }
  .row:not(.no-transition){ transition:transform .18s ease; }
  .row.placeholder{ opacity:0; }

  .mark-cell{
    flex:0 0 26px;
    width:26px;
    height:26px;
  }

  .priority-swatch{
    border-radius:9px;
    border:1px dashed var(--divider);
    background:var(--surface-2);
    padding:0;
    cursor:pointer;
    transition:background-color .12s ease, border-color .12s ease;
  }
  .priority-swatch[data-priority="1"]{ background:var(--mark-pink); border-color:var(--mark-pink); border-style:solid; }
  .priority-swatch[data-priority="2"]{ background:var(--mark-yellow); border-color:var(--mark-yellow); border-style:solid; }
  .priority-swatch[data-priority="3"]{ background:var(--mark-blue); border-color:var(--mark-blue); border-style:solid; }
  .priority-swatch:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .item-text{
    flex:1;
    min-width:0;
    font-size:19px;
    font-weight:600;
    line-height:1.3;
    word-break:break-word;
    color:var(--ink);
  }
  .row.done .item-text{
    text-decoration:line-through;
    text-decoration-thickness:1.5px;
    color:var(--ink-muted);
  }
  .row.done .mark-cell{ opacity:0.55; }

  .buy-btn{
    flex:0 0 auto;
    border:none;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent-soft-ink);
    font-size:14px;
    font-weight:700;
    letter-spacing:0.02em;
    padding:6px 12px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .12s ease;
  }
  .buy-btn:active{ transform:scale(0.92); }

  .purchased-label{
    flex:0 0 auto;
    font-size:17px;
    font-weight:600;
    color:var(--ink-muted);
    white-space:nowrap;
  }

  .drag-ghost{
    position:fixed;
    left:0;
    pointer-events:none;
    z-index:1000;
    background:var(--surface);
    border-radius:var(--radius-md);
    box-shadow:0 10px 24px rgba(0,0,0,0.22);
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 14px;
  }

  @media (prefers-reduced-motion: reduce){
    .row, .add-btn{ transition:none !important; }
  }
</style>

<div class="app">
  <header class="topbar">
    <h1>まこ の買い物リスト 🛒</h1>
    <div class="topbar-right">
      <span class="sync-status" id="syncStatus" hidden></span>
      <span class="count" id="count">0件</span>
    </div>
  </header>

  <div class="addbar">
    <button type="button" id="markInput" class="mark-input priority-swatch" data-priority="0" aria-label="優先度: なし"></button>
    <input id="itemInput" name="item-query" class="name-input" placeholder="品名を入力" aria-label="品名" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="addBtn" class="add-btn" aria-label="追加">＋</button>
  </div>

  <ul class="list" id="list"></ul>
</div>

<script>
(function(){
  var STORAGE_KEY = 'do-shopping-list-mako-v1';
  var MAX_TEXT_LEN = 12;
  var OPEN_OFFSET = -84;
  var COMPLETE_OFFSET = 84;
  var COMPLETE_THRESHOLD = 56;
  var PRIORITY_LABELS = ['なし', 'ピンク', '黄色', '水色'];
  function setSwatchState(el, level){
    el.dataset.priority = String(level);
    el.setAttribute('aria-label', '優先度: ' + PRIORITY_LABELS[level]);
  }
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var syncStatusEl = document.getElementById('syncStatus');
  var markInput = document.getElementById('markInput');
  var nameInput = document.getElementById('itemInput');
  var addBtn = document.getElementById('addBtn');

  // ---- Optional cross-device sync (Firebase Realtime Database) ----
  // Fill in your project's config (Firebase console > Project settings > your web app)
  // to sync this list across devices. Left as-is, the app just uses local storage.
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyC_FoDT2MMUcOmfxNDEtEFEoZv_DtKOuXI",
    authDomain: "kaimono-list-ce76d.firebaseapp.com",
    databaseURL: "https://kaimono-list-ce76d-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kaimono-list-ce76d"
  };
  var FIREBASE_ENABLED = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
  var dbRef = null;
  var fb = null; // holds {set, onValue} once the SDK has loaded
  var syncTimer = null;
  var gestureActive = false;
  var pendingRemote = null;

  if(FIREBASE_ENABLED){
    // Loaded on demand (not a static import) so the app has zero network
    // dependency and works fully offline when sync isn't configured.
    Promise.all([
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js")
    ]).then(function(mods){
      var initializeApp = mods[0].initializeApp;
      var getDatabase = mods[1].getDatabase, ref = mods[1].ref, onValue = mods[1].onValue, set = mods[1].set;
      var app = initializeApp(FIREBASE_CONFIG);
      var db = getDatabase(app);
      dbRef = ref(db, 'sharedList/mako');
      fb = { onValue: onValue, set: set };

      syncStatusEl.hidden = false;
      syncStatusEl.textContent = '☁️ 同期中';

      onValue(ref(db, '.info/connected'), function(snap){
        var connected = snap.val() === true;
        syncStatusEl.textContent = connected ? '☁️ 同期中' : '📵 オフライン';
        syncStatusEl.classList.toggle('is-offline', !connected);
      });

      onValue(dbRef, function(snapshot){
        var data = snapshot.val();
        if(data == null){
          pushToFirebase();
          return;
        }
        if(JSON.stringify(data) === JSON.stringify(items)) return;
        if(gestureActive){
          pendingRemote = data;
        } else {
          applyRemote(data);
        }
      });
    }).catch(function(err){
      console.warn('端末間の同期を利用できませんでした。この端末内のみの保存で続けます。', err);
    });
  }

  function applyRemote(data){
    items = sanitizeItems(data);
    if(JSON.stringify(items) !== JSON.stringify(data)){
      // 同期先に長すぎる品名や壊れたデータがあった。詰めた結果を書き戻して
      // 共有データ自体をきれいにする（放置すると毎回作り直すことになる）。
      save();
    } else {
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }catch(e){}
    }
    render();
  }

  function finishGesture(){
    gestureActive = false;
    if(pendingRemote){
      var data = pendingRemote;
      pendingRemote = null;
      applyRemote(data);
    }
  }

  function pushToFirebase(){
    if(!dbRef || !fb) return;
    fb.set(dbRef, items).catch(function(){});
  }

  // 品名は12文字まで。maxlength は手入力だけの歯止めなので、貼り付け・
  // localStorage の改ざん・同期で届くデータも必ずここを通して詰める。
  function clampText(value){
    if(typeof value !== 'string') return '';
    var chars = Array.from(value.replace(/[\u0000-\u001f\u007f]/g, '').trim());
    return chars.slice(0, MAX_TEXT_LEN).join('');
  }
  function sanitizeDate(value){
    if(!value || typeof value !== 'object') return null;
    var y = Number(value.y), m = Number(value.m), d = Number(value.d);
    if(!(y >= 1970 && y <= 9999 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
    return { y: Math.floor(y), m: Math.floor(m), d: Math.floor(d) };
  }
  function sanitizeItems(data){
    if(!Array.isArray(data)) return [];
    var clean = [];
    for(var i = 0; i < data.length; i++){
      var item = data[i];
      if(!item || typeof item !== 'object') continue;
      var text = clampText(item.text);
      if(!text) continue;
      var priority = Number(item.priority);
      if(!(priority >= 0 && priority < PRIORITY_LABELS.length)) priority = 0;
      var fresh = {
        id: typeof item.id === 'string' ? item.id.slice(0, 64) : uid(),
        priority: Math.floor(priority),
        text: text,
        done: item.done === true
      };
      var when = sanitizeDate(item.purchasedAt);
      if(when) fresh.purchasedAt = when;
      clean.push(fresh);
    }
    return clean;
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return sanitizeItems(JSON.parse(raw));
    }catch(e){}
    return [
      {id:uid(), priority:0, text:'キャベツ', done:false},
      {id:uid(), priority:0, text:'牛乳', done:false},
      {id:uid(), priority:0, text:'ティッシュ', done:false}
    ];
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }catch(e){}
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(pushToFirebase, 300);
  }
  function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }

  var items = load();
  var openId = null;

  var momentumId = null;
  function cancelMomentum(){
    if(momentumId){ cancelAnimationFrame(momentumId); momentumId = null; }
  }
  function startMomentum(v){
    cancelMomentum();
    var lastTs = null;
    function step(ts){
      if(lastTs == null) lastTs = ts;
      var dt = Math.min(ts - lastTs, 32);
      lastTs = ts;
      v *= Math.pow(0.05, dt / 1000);
      var maxScroll = listEl.scrollHeight - listEl.clientHeight;
      var next = listEl.scrollTop + v * dt;
      if(next <= 0){ listEl.scrollTop = 0; momentumId = null; return; }
      if(next >= maxScroll){ listEl.scrollTop = maxScroll; momentumId = null; return; }
      listEl.scrollTop = next;
      if(Math.abs(v) < 0.02){ momentumId = null; return; }
      momentumId = requestAnimationFrame(step);
    }
    momentumId = requestAnimationFrame(step);
  }

  function render(){
    listEl.innerHTML = '';
    countEl.textContent = items.length + '件';
    if(items.length === 0){
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = 'リストは空です。上の欄から追加してください。';
      listEl.appendChild(empty);
      return;
    }
    items.forEach(function(item){
      listEl.appendChild(buildRow(item));
    });
  }

  function buildRow(item){
    var wrapper = document.createElement('li');
    wrapper.className = 'row-wrapper';
    wrapper.dataset.id = item.id;

    var completeBg = document.createElement('div');
    completeBg.className = 'row-complete-bg';
    var completeLabel = document.createElement('span');
    completeLabel.className = 'complete-label';
    completeLabel.textContent = item.done ? '↺ 取り消し' : '✓ 完了';
    completeBg.appendChild(completeLabel);

    var delBg = document.createElement('div');
    delBg.className = 'row-delete-bg';
    var delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.type = 'button';
    delBtn.textContent = '削除';
    delBtn.addEventListener('click', function(){ removeItem(item.id); });
    delBg.appendChild(delBtn);

    var row = document.createElement('div');
    row.className = 'row' + (item.done ? ' done' : '');
    row.dataset.id = item.id;

    var mark = document.createElement('button');
    mark.type = 'button';
    mark.className = 'mark-cell priority-swatch';
    setSwatchState(mark, item.priority || 0);
    mark.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    mark.addEventListener('click', function(e){
      e.stopPropagation();
      item.priority = ((item.priority || 0) + 1) % PRIORITY_LABELS.length;
      setSwatchState(mark, item.priority);
      save();
    });

    var text = document.createElement('span');
    text.className = 'item-text';
    text.textContent = item.text;

    row.appendChild(mark);
    row.appendChild(text);

    if(item.done){
      var purchasedLabel = document.createElement('span');
      purchasedLabel.className = 'purchased-label';
      if(item.purchasedAt){
        var daysAgo = daysSincePurchase(item.purchasedAt);
        purchasedLabel.innerHTML = '';
        if(daysAgo <= 0){
          purchasedLabel.appendChild(document.createTextNode('今日購入'));
        } else {
          var daysSpan = document.createElement('span');
          daysSpan.className = 'purchased-days';
          daysSpan.textContent = daysAgo + '日前';
          purchasedLabel.appendChild(daysSpan);
          purchasedLabel.appendChild(document.createTextNode('購入'));
        }
      }
      row.appendChild(purchasedLabel);
    } else {
      var buyBtn = document.createElement('button');
      buyBtn.type = 'button';
      buyBtn.className = 'buy-btn';
      buyBtn.textContent = '購入';
      buyBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      buyBtn.addEventListener('click', function(e){
        e.stopPropagation();
        item.priority = 0;
        toggleDone(item, true);
      });
      row.appendChild(buyBtn);
    }

    wrapper.appendChild(completeBg);
    wrapper.appendChild(delBg);
    wrapper.appendChild(row);

    attachRowGestures(wrapper, row, item);
    return wrapper;
  }

  function daysSincePurchase(purchasedAt){
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var y = (purchasedAt.y != null) ? purchasedAt.y : now.getFullYear();
    var purchased = new Date(y, purchasedAt.m - 1, purchasedAt.d);
    return Math.round((today - purchased) / 86400000);
  }

  function toggleDone(item, recordPurchase){
    var wasDone = item.done;
    item.done = !wasDone;
    if(item.done){
      if(recordPurchase){
        var now = new Date();
        item.purchasedAt = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };
      }
    } else {
      item.purchasedAt = null;
    }
    var idx = items.indexOf(item);
    if(idx > -1){
      items.splice(idx, 1);
      if(item.done){
        var insertAt = items.findIndex(function(it){ return it.done; });
        if(insertAt === -1) insertAt = items.length;
        items.splice(insertAt, 0, item);
      } else {
        items.unshift(item);
      }
    }
    save();
    render();
  }

  function removeItem(id){
    var wrapper = listEl.querySelector('.row-wrapper[data-id="'+id+'"]');
    if(wrapper){
      wrapper.style.transition = 'max-height .18s ease, opacity .18s ease';
      wrapper.style.maxHeight = wrapper.offsetHeight + 'px';
      requestAnimationFrame(function(){
        wrapper.style.maxHeight = '0px';
        wrapper.style.opacity = '0';
      });
      wrapper.addEventListener('transitionend', function(){
        items = items.filter(function(it){ return it.id !== id; });
        save();
        render();
      }, {once:true});
    } else {
      items = items.filter(function(it){ return it.id !== id; });
      save();
      render();
    }
  }

  function closeOpenRow(){
    if(openId == null) return;
    var row = listEl.querySelector('.row[data-id="'+openId+'"]');
    if(row) row.style.transform = 'translateX(0px)';
    openId = null;
  }

  var addPriority = 0;
  setSwatchState(markInput, addPriority);
  markInput.addEventListener('click', function(){
    addPriority = (addPriority + 1) % PRIORITY_LABELS.length;
    setSwatchState(markInput, addPriority);
  });

  function addItem(keepFocus){
    var text = clampText(nameInput.value);
    if(!text) { if(keepFocus) nameInput.focus(); return; }
    items.unshift({id:uid(), priority:addPriority, text:text, done:false});
    nameInput.value = '';
    addPriority = 0;
    setSwatchState(markInput, 0);
    save();
    render();
    if(keepFocus) nameInput.focus();
  }

  addBtn.addEventListener('click', function(){ addItem(true); });
  nameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); addItem(false); nameInput.blur(); }
  });

  var LONGPRESS_MS = 480;
  var MOVE_THRESHOLD = 10;

  function attachRowGestures(wrapper, row, item){
    var pointerId = null;
    var state = 'idle';
    var startX = 0, startY = 0, base = 0;
    var longPressTimer = null;
    var ghost = null;
    var rowHeight = 0;
    var lastTargetPos = -1;
    var scrollStartTop = 0;
    var lastMoveTs = 0, lastMoveY = 0, velocityY = 0;

    function clearTimer(){
      if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
    }

    function onPointerDown(e){
      if(e.target === row.querySelector('.mark-cell')) return;
      if(state !== 'idle') return;
      cancelMomentum();
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      scrollStartTop = listEl.scrollTop;
      base = (openId === item.id) ? OPEN_OFFSET : 0;
      state = 'pending';
      gestureActive = true;
      row.classList.add('no-transition');
      longPressTimer = setTimeout(function(){
        if(state !== 'pending') return;
        startDrag(e);
      }, LONGPRESS_MS);
    }

    function startDrag(e){
      state = 'dragging';
      clearTimer();
      try{ row.setPointerCapture(pointerId); }catch(err){}
      if(navigator.vibrate) navigator.vibrate(12);
      var rect = row.getBoundingClientRect();
      rowHeight = rect.height;

      ghost = row.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.width = rect.width + 'px';
      ghost.style.top = rect.top + 'px';
      ghost.style.left = rect.left + 'px';
      document.body.appendChild(ghost);

      row.classList.add('placeholder');
      row.style.transform = 'translateX(0px)';
      wrapper.style.height = rowHeight + 'px';
      lastTargetPos = -1;
    }

    function onPointerMove(e){
      if(state === 'pending'){
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if(Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD){
          clearTimer();
          if(Math.abs(dx) > Math.abs(dy)){
            state = 'swiping';
            try{ row.setPointerCapture(pointerId); }catch(err){}
          } else {
            state = 'scrolling';
            row.classList.remove('no-transition');
            lastMoveTs = e.timeStamp;
            lastMoveY = e.clientY;
            velocityY = 0;
            try{ row.setPointerCapture(pointerId); }catch(err){}
          }
        } else {
          return;
        }
      }
      if(state === 'swiping'){
        var ddx = e.clientX - startX;
        var maxBound = (base < 0) ? 0 : COMPLETE_OFFSET;
        var t = Math.max(OPEN_OFFSET, Math.min(maxBound, base + ddx));
        row.style.transform = 'translateX(' + t + 'px)';
        return;
      }
      if(state === 'scrolling'){
        var maxScroll = listEl.scrollHeight - listEl.clientHeight;
        var next = scrollStartTop - (e.clientY - startY);
        listEl.scrollTop = Math.max(0, Math.min(maxScroll, next));
        var dt = e.timeStamp - lastMoveTs;
        if(dt > 0){
          var instV = (e.clientY - lastMoveY) / dt;
          velocityY = velocityY * 0.7 + instV * 0.3;
        }
        lastMoveTs = e.timeStamp;
        lastMoveY = e.clientY;
        return;
      }
      if(state === 'dragging'){
        var gy = e.clientY - (rowHeight/2);
        ghost.style.top = gy + 'px';
        var others = Array.prototype.slice.call(listEl.children).filter(function(s){ return s !== wrapper; });
        var cy = e.clientY;
        var targetPos = others.length;
        for(var i=0;i<others.length;i++){
          var r = others[i].getBoundingClientRect();
          var mid = r.top + r.height/2;
          if(cy < mid){ targetPos = i; break; }
        }
        if(targetPos !== lastTargetPos){
          lastTargetPos = targetPos;
          if(targetPos >= others.length){
            listEl.appendChild(wrapper);
          } else {
            listEl.insertBefore(wrapper, others[targetPos]);
          }
          moveItemInArray(item.id, targetPos);
          // insertBefore/appendChild on the captured element's ancestor releases
          // pointer capture even for a same-parent reorder; re-acquire it so
          // subsequent moves in this same drag keep being tracked.
          try{ row.setPointerCapture(pointerId); }catch(err){}
        }
      }
    }

    function moveItemInArray(id, targetIndex){
      var idx = items.findIndex(function(it){ return it.id === id; });
      if(idx === -1) return;
      var it = items.splice(idx,1)[0];
      items.splice(targetIndex,0,it);
    }

    function endGesture(){
      if(state === 'pending'){
        clearTimer();
        row.classList.remove('no-transition');
        handleTap();
      } else if(state === 'swiping'){
        row.classList.remove('no-transition');
        var cur = row.style.transform;
        var val = parseFloat(cur.replace('translateX(','')) || 0;
        if(val <= OPEN_OFFSET/2){
          row.style.transform = 'translateX('+OPEN_OFFSET+'px)';
          if(openId && openId !== item.id) closeOpenRow();
          openId = item.id;
        } else if(val >= COMPLETE_THRESHOLD){
          row.style.transform = 'translateX(0px)';
          if(openId === item.id) openId = null;
          item.priority = 0;
          toggleDone(item);
        } else {
          row.style.transform = 'translateX(0px)';
          if(openId === item.id) openId = null;
        }
      } else if(state === 'scrolling'){
        startMomentum(-velocityY);
      } else if(state === 'dragging'){
        row.classList.remove('placeholder');
        row.classList.add('no-transition');
        wrapper.style.height = '';
        if(ghost){ ghost.remove(); ghost = null; }
        save();
        requestAnimationFrame(function(){ row.classList.remove('no-transition'); });
      }
      state = 'idle';
      pointerId = null;
      finishGesture();
    }

    function handleTap(){
      if(openId != null){ closeOpenRow(); }
    }

    function onPointerUp(e){
      if(pointerId !== null && e.pointerId !== pointerId) return;
      endGesture();
    }
    function onPointerCancel(e){
      if(pointerId !== null && e.pointerId !== pointerId) return;
      if(state === 'dragging'){
        row.classList.remove('placeholder');
        wrapper.style.height = '';
        if(ghost){ ghost.remove(); ghost = null; }
      } else if(state === 'swiping'){
        row.style.transform = (openId === item.id) ? 'translateX('+OPEN_OFFSET+'px)' : 'translateX(0px)';
      }
      row.classList.remove('no-transition');
      state = 'idle';
      pointerId = null;
      finishGesture();
    }

    row.addEventListener('pointerdown', onPointerDown);
    row.addEventListener('pointermove', onPointerMove);
    row.addEventListener('pointerup', onPointerUp);
    row.addEventListener('pointercancel', onPointerCancel);
  }

  render();
})();
</script>
